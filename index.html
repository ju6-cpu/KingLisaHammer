<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>초봉식쉼터 : 증폭의 마법망치 시뮬레이터</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;700;900&display=swap');
        
        body {
            font-family: 'Noto Sans KR', sans-serif;
            background-color: #0f172a; /* slate-900 */
            color: #f8fafc; /* slate-50 */
            user-select: none;
        }

        /* 공통 스크롤바 커스텀 */
        .custom-scroll::-webkit-scrollbar {
            width: 8px;
        }
        .custom-scroll::-webkit-scrollbar-track {
            background: #1e293b; 
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb {
            background: #475569; 
            border-radius: 4px;
        }
        .custom-scroll::-webkit-scrollbar-thumb:hover {
            background: #64748b; 
        }

        /* 반응형: 제목을 한 줄로 유지하고 작은 화면에서는 글자/버튼 크기 축소 */
        .app-title {
            font-size: clamp(0.9rem, 5vw, 1.25rem);
            overflow: hidden;
            text-overflow: ellipsis;
        }
        @media (max-width: 480px) {
            body .app-card { padding: 1rem; }
            .app-reset { font-size: 0.75rem; padding: 0.375rem 0.625rem; }
        }

        .level-text {
            text-shadow: 0 0 10px rgba(56, 189, 248, 0.5);
        }
        
        .log-enter {
            animation: fadeIn 0.3s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-5px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* 현재 레벨 행 강조 애니메이션 */
        .highlight-row {
            background-color: rgba(245, 158, 11, 0.15) !important;
            box-shadow: inset 0 0 15px rgba(245, 158, 11, 0.4);
            border: 1px solid rgba(245, 158, 11, 0.8) !important;
            position: relative;
            z-index: 10;
        }
        .highlight-row td {
            font-weight: 700;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center gap-4 p-4">

    <!-- 2단 레이아웃 컨테이너 -->
    <div class="max-w-6xl w-full grid grid-cols-1 lg:grid-cols-2 gap-6 h-full lg:h-[85vh]">
        
        <!-- ================= 좌측: 시뮬레이터 & 통계 ================= -->
        <!-- 좌측 컬럼 전체에 스크롤을 주어 하단 통계 패널까지 볼 수 있게 함 -->
        <div class="app-card bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl p-6 flex flex-col gap-6 overflow-y-auto custom-scroll flex-shrink-0 h-full lg:h-full">
            
            <!-- 헤더 및 타이틀 -->
            <div class="flex justify-between items-center gap-2 border-b border-slate-700 pb-4 flex-shrink-0">
                <h1 class="app-title font-bold text-slate-200 whitespace-nowrap min-w-0">증폭의 마법망치 시뮬레이터</h1>
                <button id="btn-reset" class="app-reset flex-shrink-0 whitespace-nowrap bg-red-900/50 hover:bg-red-800 text-red-300 border border-red-800/50 text-sm font-bold py-1.5 px-4 rounded-lg transition active:scale-95">
                    초기화
                </button>
            </div>

            <!-- 시작 레벨 설정 -->
            <div class="flex items-center gap-3 bg-slate-900 p-3 rounded-xl border border-slate-700 flex-shrink-0">
                <label for="input-start-level" class="text-sm font-bold text-slate-400 whitespace-nowrap">시작 레벨 설정</label>
                <input type="number" id="input-start-level" min="0" max="29" value="0" class="w-16 bg-slate-800 border border-slate-600 text-slate-200 text-center rounded-lg py-1 px-2 focus:outline-none focus:border-sky-500 font-mono">
                <button id="btn-apply-level" class="whitespace-nowrap bg-slate-700 hover:bg-slate-600 text-slate-200 border border-slate-600 text-sm font-bold py-1.5 px-4 rounded-lg transition active:scale-95 ml-auto">
                    적용 및 리셋
                </button>
            </div>

            <!-- 스탯 정보 -->
            <div class="grid grid-cols-2 gap-4 flex-shrink-0">
                <div class="col-span-2 bg-slate-900 rounded-xl p-6 text-center border border-slate-700 shadow-inner flex flex-col justify-center items-center">
                    <p class="text-slate-400 text-sm mb-1 font-bold">현재 레벨</p>
                    <div class="text-6xl font-black text-sky-400 level-text tracking-tighter" id="display-level">
                        0
                    </div>
                </div>
                
                <div class="bg-slate-900 rounded-xl p-4 text-center border border-slate-700">
                    <p class="text-slate-400 text-xs mb-1">총 시도 횟수</p>
                    <p class="text-xl font-bold text-slate-100" id="display-attempts">0</p>
                </div>
                
                <div class="bg-slate-900 rounded-xl p-4 text-center border border-slate-700">
                    <p class="text-slate-400 text-xs mb-1">누적 소모 망치</p>
                    <p class="text-xl font-bold text-amber-400" id="display-hammers">0</p>
                </div>
            </div>

            <!-- 확률 정보 패널 -->
            <div class="bg-slate-900 rounded-xl p-4 border border-slate-700 shadow-inner flex flex-col gap-3 flex-shrink-0">
                <div class="text-center text-slate-300 text-sm font-bold border-b border-slate-700 pb-2">
                    다음 증폭 확률 <span class="text-amber-400 font-normal ml-2">(망치 <span id="info-cost">0</span>개 소모)</span>
                </div>
                <div class="grid grid-cols-4 gap-2 text-center text-sm">
                    <div class="bg-slate-800 rounded p-2 border border-emerald-900/50">
                        <p class="text-slate-400 text-xs mb-1">성공</p>
                        <p class="text-emerald-400 font-bold"><span id="prob-s">0</span>%</p>
                    </div>
                    <div class="bg-slate-800 rounded p-2 border border-slate-700">
                        <p class="text-slate-400 text-xs mb-1">유지</p>
                        <p class="text-slate-300 font-bold"><span id="prob-m">0</span>%</p>
                    </div>
                    <div class="bg-slate-800 rounded p-2 border border-rose-900/50">
                        <p class="text-slate-400 text-xs mb-1">하락</p>
                        <p class="text-rose-500 font-bold"><span id="prob-f">0</span>%</p>
                    </div>
                    <div class="bg-slate-800 rounded p-2 border border-purple-900/50">
                        <p class="text-slate-400 text-xs mb-1">초기화</p>
                        <p class="text-purple-500 font-bold"><span id="prob-r">0</span>%</p>
                    </div>
                </div>
            </div>

            <!-- 증폭 버튼 -->
            <button id="btn-enhance" class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-black py-4 rounded-xl text-2xl shadow-[0_0_15px_rgba(79,70,229,0.4)] transform transition active:scale-95 disabled:opacity-50 disabled:cursor-not-allowed disabled:transform-none disabled:shadow-none flex-shrink-0">
                증폭하기
            </button>

            <!-- 수동 로그 창 (높이 고정하여 하단 통계 패널이 보이도록 유도) -->
            <div class="flex flex-col gap-2 flex-shrink-0">
                <h2 class="text-sm font-bold text-slate-400 ml-1">수동 증폭 로그</h2>
                <div id="log-container" class="h-[180px] bg-slate-950 rounded-xl p-3 overflow-y-auto custom-scroll border border-slate-800 flex flex-col gap-2 relative">
                    <div class="text-center text-slate-600 text-sm mt-4 italic absolute inset-0 flex items-center justify-center">증폭을 시작해보세요!</div>
                </div>
            </div>

            <!-- ================= 자동 시뮬레이션 통계 패널 ================= -->
            <div class="bg-slate-900 border border-slate-700 rounded-xl p-5 flex flex-col gap-4 mt-2 shadow-inner flex-shrink-0">
                <h2 class="text-lg font-bold text-slate-200 border-b border-slate-700 pb-2 flex items-center gap-2">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 text-indigo-400" viewBox="0 0 20 20" fill="currentColor">
                      <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zm1-12a1 1 0 10-2 0v4a1 1 0 00.293.707l2.828 2.829a1 1 0 101.415-1.415L11 9.586V6z" clip-rule="evenodd" />
                    </svg>
                    자동 시뮬레이션 통계
                </h2>
                
                <div class="grid grid-cols-3 gap-3">
                    <div>
                        <label for="auto-start" class="block text-xs font-bold text-slate-400 mb-1">시작 레벨 (0~29)</label>
                        <input type="number" id="auto-start" value="0" min="0" max="29" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-2 py-1.5 text-slate-200 focus:outline-none focus:border-indigo-500 font-mono text-center">
                    </div>
                    <div>
                        <label for="auto-target" class="block text-xs font-bold text-slate-400 mb-1">목표 레벨 (1~30)</label>
                        <input type="number" id="auto-target" value="15" min="1" max="30" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-2 py-1.5 text-slate-200 focus:outline-none focus:border-indigo-500 font-mono text-center">
                    </div>
                    <div>
                        <label for="auto-runs" class="block text-xs font-bold text-slate-400 mb-1">시행 횟수 (최대 1만)</label>
                        <input type="number" id="auto-runs" value="100" min="1" max="10000" class="w-full bg-slate-800 border border-slate-600 rounded-lg px-2 py-1.5 text-slate-200 focus:outline-none focus:border-indigo-500 font-mono text-center">
                    </div>
                </div>

                <!-- 에러 메시지 표시 영역 (경고창 대체) -->
                <div id="auto-error" class="text-rose-500 text-sm font-bold hidden bg-rose-950/30 p-2 rounded border border-rose-900/50 text-center"></div>

                <button id="btn-auto-sim" class="w-full bg-slate-700 hover:bg-slate-600 text-slate-100 font-bold py-2.5 rounded-lg transition active:scale-95 border border-slate-600 flex justify-center items-center gap-2">
                    자동 시뮬레이션 실행
                </button>

                <!-- 결과 영역 (초기엔 숨김) -->
                <div id="auto-results" class="hidden flex-col gap-3 mt-2">
                    <h3 class="text-sm font-bold text-slate-400 text-center">소모 망치 요약</h3>
                    <div class="grid grid-cols-3 gap-2 text-center">
                        <div class="bg-slate-800 rounded-lg p-2 border border-amber-900/50">
                            <p class="text-slate-400 text-xs mb-1">평균 소모</p>
                            <p id="res-avg" class="text-amber-400 font-bold text-sm sm:text-base"></p>
                        </div>
                        <div class="bg-slate-800 rounded-lg p-2 border border-emerald-900/50">
                            <p class="text-slate-400 text-xs mb-1">최소 소모</p>
                            <p id="res-min" class="text-emerald-400 font-bold text-sm sm:text-base"></p>
                        </div>
                        <div class="bg-slate-800 rounded-lg p-2 border border-rose-900/50">
                            <p class="text-slate-400 text-xs mb-1">최대 소모</p>
                            <p id="res-max" class="text-rose-400 font-bold text-sm sm:text-base"></p>
                        </div>
                    </div>
                    
                    <div class="bg-slate-950 rounded-lg p-3 border border-slate-800 h-48 overflow-y-auto custom-scroll mt-1">
                        <ul id="res-list" class="text-xs text-slate-300 space-y-1.5 font-mono">
                            <!-- JS 렌더링 -->
                        </ul>
                    </div>
                </div>
            </div>

        </div>

        <!-- ================= 우측: 확률표 ================= -->
        <div class="bg-slate-800 border border-slate-700 rounded-2xl shadow-2xl overflow-hidden flex flex-col h-[600px] lg:h-full">
            <div class="bg-slate-900 p-4 border-b border-slate-700 flex-shrink-0 flex justify-between items-center">
                <h2 class="text-lg font-bold text-slate-200">전체 증폭 확률표</h2>
                <span class="text-xs text-slate-400 px-2 py-1 bg-slate-800 rounded border border-slate-700">MAX 30 Lv</span>
            </div>
            
            <div class="flex-1 overflow-auto custom-scroll bg-slate-800 relative" id="prob-table-container">
                <table class="w-full text-center text-sm border-collapse">
                    <thead class="sticky top-0 bg-slate-900 text-slate-300 shadow-md z-20">
                        <tr>
                            <th class="py-3 px-2 border-b border-slate-700 font-bold w-1/6">구간</th>
                            <th class="py-3 px-2 border-b border-slate-700 font-bold text-emerald-400 w-1/6">성공</th>
                            <th class="py-3 px-2 border-b border-slate-700 font-bold text-slate-400 w-1/6">유지</th>
                            <th class="py-3 px-2 border-b border-slate-700 font-bold text-rose-500 w-1/6">하락</th>
                            <th class="py-3 px-2 border-b border-slate-700 font-bold text-purple-400 w-1/6">초기화</th>
                            <th class="py-3 px-2 border-b border-slate-700 font-bold text-amber-400 w-1/6">망치</th>
                        </tr>
                    </thead>
                    <tbody id="prob-table-body">
                        <!-- Javascript로 렌더링 됩니다 -->
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <footer class="text-center text-xs text-slate-500 pb-2">by 초봉식쉼터 : 민시은</footer>

    <script>
        // 확률표 데이터
        const probData = {
            0: { s: 100, m: 0, d: 0, r: 0, h: 1 },
            1: { s: 90, m: 10, d: 0, r: 0, h: 2 },
            2: { s: 85, m: 15, d: 0, r: 0, h: 3 },
            3: { s: 80, m: 20, d: 0, r: 0, h: 4 },
            4: { s: 75, m: 25, d: 0, r: 0, h: 5 },
            5: { s: 70, m: 30, d: 0, r: 0, h: 6 },
            6: { s: 65, m: 35, d: 0, r: 0, h: 7 },
            7: { s: 60, m: 40, d: 0, r: 0, h: 8 },
            8: { s: 55, m: 45, d: 0, r: 0, h: 9 },
            9: { s: 50, m: 50, d: 0, r: 0, h: 10 },
            10: { s: 45, m: 50, d: 5, r: 0, h: 11 },
            11: { s: 40, m: 54, d: 6, r: 0, h: 12 },
            12: { s: 35, m: 58, d: 7, r: 0, h: 13 },
            13: { s: 30, m: 62, d: 8, r: 0, h: 14 },
            14: { s: 25, m: 66, d: 9, r: 0, h: 15 },
            15: { s: 24, m: 65, d: 10, r: 1, h: 16 },
            16: { s: 23, m: 64.75, d: 11, r: 1.25, h: 17 },
            17: { s: 22, m: 64.5, d: 12, r: 1.5, h: 18 },
            18: { s: 21, m: 64.25, d: 13, r: 1.75, h: 19 },
            19: { s: 20, m: 64, d: 14, r: 2, h: 20 },
            20: { s: 19, m: 62.75, d: 16, r: 2.25, h: 21 },
            21: { s: 18, m: 61.5, d: 18, r: 2.5, h: 22 },
            22: { s: 17, m: 60.25, d: 20, r: 2.75, h: 23 },
            23: { s: 16, m: 59, d: 22, r: 3, h: 24 },
            24: { s: 15, m: 57.75, d: 24, r: 3.25, h: 25 },
            25: { s: 14, m: 56.5, d: 26, r: 3.5, h: 26 },
            26: { s: 13, m: 55.25, d: 28, r: 3.75, h: 27 },
            27: { s: 12, m: 54, d: 30, r: 4, h: 28 },
            28: { s: 11, m: 53.75, d: 32, r: 4.25, h: 29 },
            29: { s: 10, m: 51.5, d: 34, r: 4.5, h: 30 }
        };

        const MAX_LEVEL = 30;

        // --- 수동 시뮬레이터 로직 ---
        let currentLevel = 0;
        let totalAttempts = 0;
        let totalHammers = 0;

        const elLevel = document.getElementById('display-level');
        const elAttempts = document.getElementById('display-attempts');
        const elHammers = document.getElementById('display-hammers');
        const btnEnhance = document.getElementById('btn-enhance');
        const btnReset = document.getElementById('btn-reset');
        const inputStartLevel = document.getElementById('input-start-level');
        const btnApplyLevel = document.getElementById('btn-apply-level');
        const logContainer = document.getElementById('log-container');
        const infoCost = document.getElementById('info-cost');
        const probS = document.getElementById('prob-s');
        const probM = document.getElementById('prob-m');
        const probF = document.getElementById('prob-f');
        const probR = document.getElementById('prob-r');
        const tbody = document.getElementById('prob-table-body');
        const probTableContainer = document.getElementById('prob-table-container');

        function renderProbabilityTable() {
            tbody.innerHTML = '';
            for (let i = 0; i < MAX_LEVEL; i++) {
                const data = probData[i];
                const tr = document.createElement('tr');
                tr.id = `prob-row-${i}`;
                tr.className = "border-b border-slate-700/50 transition-all duration-300";
                
                tr.innerHTML = `
                    <td class="py-3 px-2 font-mono text-slate-300 font-bold bg-slate-900/50 border-r border-slate-700/50">${i} &rarr; ${i+1}</td>
                    <td class="py-3 px-2 ${data.s > 0 ? 'text-emerald-400' : 'text-slate-600'}">${data.s > 0 ? data.s + '%' : '-'}</td>
                    <td class="py-3 px-2 ${data.m > 0 ? 'text-slate-300' : 'text-slate-600'}">${data.m > 0 ? data.m + '%' : '-'}</td>
                    <td class="py-3 px-2 ${data.d > 0 ? 'text-rose-500' : 'text-slate-600'}">${data.d > 0 ? data.d + '%' : '-'}</td>
                    <td class="py-3 px-2 ${data.r > 0 ? 'text-purple-400' : 'text-slate-600'}">${data.r > 0 ? data.r + '%' : '-'}</td>
                    <td class="py-3 px-2 text-amber-400 font-bold bg-slate-900/30">${data.h}</td>
                `;
                tbody.appendChild(tr);
            }
        }

        function highlightCurrentRow() {
            const rows = tbody.querySelectorAll('tr');
            rows.forEach(row => {
                row.classList.remove('highlight-row');
                row.style.border = "";
            });

            if (currentLevel < MAX_LEVEL) {
                const targetRow = document.getElementById(`prob-row-${currentLevel}`);
                if (targetRow) {
                    targetRow.classList.add('highlight-row');
                    
                    // 테이블 컨테이너 내에서 선택된 행이 보이도록 자동 스크롤
                    const containerHeight = probTableContainer.clientHeight;
                    const rowTop = targetRow.offsetTop;
                    const rowHeight = targetRow.clientHeight;
                    
                    probTableContainer.scrollTo({
                        top: rowTop - (containerHeight / 2) + (rowHeight / 2),
                        behavior: 'smooth'
                    });
                }
            }
        }

        function updateUI() {
            elLevel.textContent = currentLevel;
            elAttempts.textContent = totalAttempts.toLocaleString();
            elHammers.textContent = totalHammers.toLocaleString();

            if (currentLevel >= MAX_LEVEL) {
                btnEnhance.disabled = true;
                btnEnhance.textContent = "MAX LEVEL";
                infoCost.textContent = "-";
                probS.textContent = "0";
                probM.textContent = "0";
                probF.textContent = "0";
                probR.textContent = "0";
            } else {
                btnEnhance.disabled = false;
                btnEnhance.textContent = "증폭하기";
                const data = probData[currentLevel];
                infoCost.textContent = data.h;
                probS.textContent = data.s;
                probM.textContent = data.m;
                probF.textContent = data.d;
                probR.textContent = data.r;
            }

            highlightCurrentRow();
        }

        function addLog(startLevel, resultText, resultColor, cost) {
            if (logContainer.children.length > 0 && logContainer.children[0].classList.contains('italic')) {
                logContainer.innerHTML = '';
            }

            const logItem = document.createElement('div');
            logItem.className = `bg-slate-900 border border-slate-800 p-2.5 rounded-lg text-sm flex items-center justify-between log-enter`;
            
            logItem.innerHTML = `
                <div class="flex items-center">
                    <span class="text-slate-400 font-mono w-6 text-right">${startLevel}</span>
                    <span class="text-slate-600 text-xs mx-2">▶</span>
                    <span class="text-slate-200 font-mono w-6 text-left">${currentLevel}</span>
                    <span class="font-bold ${resultColor} ml-2">${resultText}</span>
                </div>
                <span class="text-xs text-slate-500">망치: ${cost}</span>
            `;

            logContainer.prepend(logItem);
        }

        function tryEnhance() {
            if (currentLevel >= MAX_LEVEL) return;
            const startLevel = currentLevel;
            const data = probData[currentLevel];
            
            totalAttempts++;
            totalHammers += data.h;

            const roll = Math.random() * 100;
            let resultText = "";
            let resultColor = "";

            if (roll < data.s) {
                currentLevel++;
                resultText = "성공!";
                resultColor = "text-emerald-400";
            } else if (roll < data.s + data.m) {
                resultText = "유지";
                resultColor = "text-slate-400";
            } else if (roll < data.s + data.m + data.d) {
                currentLevel = Math.max(0, currentLevel - 1);
                resultText = "하락";
                resultColor = "text-rose-500";
            } else {
                currentLevel = 0;
                resultText = "초기화";
                resultColor = "text-purple-500";
            }

            updateUI();
            addLog(startLevel, resultText, resultColor, data.h);
        }

        function resetSimulator(targetLevel = 0) {
            currentLevel = typeof targetLevel === 'number' ? targetLevel : 0;
            totalAttempts = 0;
            totalHammers = 0;
            logContainer.innerHTML = '<div class="text-center text-slate-600 text-sm mt-4 italic absolute inset-0 flex items-center justify-center">증폭을 시작해보세요!</div>';
            updateUI();
        }

        function applyStartLevel() {
            let level = parseInt(inputStartLevel.value, 10);
            if (isNaN(level) || level < 0) level = 0;
            if (level >= MAX_LEVEL) level = MAX_LEVEL - 1;
            inputStartLevel.value = level; 
            resetSimulator(level);
        }

        btnEnhance.addEventListener('click', tryEnhance);
        btnReset.addEventListener('click', () => resetSimulator(0));
        btnApplyLevel.addEventListener('click', applyStartLevel);

        // 초기 렌더링
        renderProbabilityTable();
        setTimeout(() => { updateUI(); }, 100);

        // --- 자동 시뮬레이션 통계 로직 ---
        const btnAutoSim = document.getElementById('btn-auto-sim');
        const autoError = document.getElementById('auto-error');
        const autoResults = document.getElementById('auto-results');
        const resAvg = document.getElementById('res-avg');
        const resMin = document.getElementById('res-min');
        const resMax = document.getElementById('res-max');
        const resList = document.getElementById('res-list');

        function runAutoSimulation() {
            // 입력값 파싱 및 검증
            let start = parseInt(document.getElementById('auto-start').value, 10) || 0;
            let target = parseInt(document.getElementById('auto-target').value, 10) || 1;
            let runs = parseInt(document.getElementById('auto-runs').value, 10) || 100;

            autoError.classList.add('hidden');
            
            if (start < 0) start = 0;
            if (target > MAX_LEVEL) target = MAX_LEVEL;
            if (runs < 1) runs = 1;
            if (runs > 10000) runs = 10000;
            
            document.getElementById('auto-start').value = start;
            document.getElementById('auto-target').value = target;
            document.getElementById('auto-runs').value = runs;

            if (start >= target) {
                autoError.textContent = "오류: 목표 레벨은 시작 레벨보다 높아야 합니다.";
                autoError.classList.remove('hidden');
                return;
            }

            // UI 잠금 및 로딩 표시
            btnAutoSim.disabled = true;
            btnAutoSim.innerHTML = `
                <svg class="animate-spin -ml-1 mr-2 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                계산 중... (최대 수초 소요)
            `;

            // 비동기로 실행하여 UI가 먼저 렌더링(로딩 표시) 될 시간을 줌
            setTimeout(() => {
                let totalHammersAll = 0;
                let minHammers = Infinity;
                let maxHammers = 0;
                const results = []; 

                for (let i = 0; i < runs; i++) {
                    let simLevel = start;
                    let simHammers = 0;
                    let loopCount = 0;
                    const MAX_LOOPS = 1000000; // 극단적 억까 방지

                    while (simLevel < target && loopCount < MAX_LOOPS) {
                        loopCount++;
                        const data = probData[simLevel];
                        simHammers += data.h;
                        
                        const roll = Math.random() * 100;
                        if (roll < data.s) {
                            simLevel++;
                        } else if (roll < data.s + data.m) {
                            // 유지 (변화 없음)
                        } else if (roll < data.s + data.m + data.d) {
                            simLevel = Math.max(0, simLevel - 1);
                        } else {
                            simLevel = 0; // 초기화
                        }
                    }

                    // 만약 MAX_LOOPS에 도달했다면 예외 처리 (거의 발생하지 않음)
                    if (loopCount >= MAX_LOOPS) {
                        console.warn(`Run ${i+1} reached max loops. Failsafe triggered.`);
                    }

                    totalHammersAll += simHammers;
                    if (simHammers < minHammers) minHammers = simHammers;
                    if (simHammers > maxHammers) maxHammers = simHammers;
                    results.push(simHammers);
                }

                const avgHammers = Math.round(totalHammersAll / runs);

                // 결과 렌더링
                resAvg.textContent = avgHammers.toLocaleString() + " 개";
                resMin.textContent = minHammers.toLocaleString() + " 개";
                resMax.textContent = maxHammers.toLocaleString() + " 개";

                resList.innerHTML = '';
                results.forEach((h, index) => {
                    const li = document.createElement('li');
                    li.className = "flex justify-between border-b border-slate-800 pb-1";
                    
                    // 최대값인 경우 강조
                    const isMax = (h === maxHammers && runs > 1);
                    const valClass = isMax ? "text-rose-400 font-bold" : "text-slate-300";
                    
                    li.innerHTML = `
                        <span class="text-slate-500">${index + 1}회차</span>
                        <span class="${valClass}">${h.toLocaleString()} 개</span>
                    `;
                    resList.appendChild(li);
                });

                autoResults.classList.remove('hidden');
                autoResults.classList.add('flex');

                // 버튼 복구
                btnAutoSim.disabled = false;
                btnAutoSim.innerHTML = '자동 시뮬레이션 실행';

            }, 50); // 50ms 딜레이 후 로직 실행
        }

        btnAutoSim.addEventListener('click', runAutoSimulation);

    </script>
</body>
</html>
